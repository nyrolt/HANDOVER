<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for dark squircle -->
    <linearGradient id="sq-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#121214"/>
      <stop offset="100%" stopColor="#050505"/>
    </linearGradient>

    <!-- Blue Dot 3D Gradient -->
    <radialGradient id="blue-sphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#93C5FD"/>
      <stop offset="40%" stopColor="#3B82F6"/>
      <stop offset="100%" stopColor="#1D4ED8"/>
    </radialGradient>

    <!-- Crossbar 3D Shading -->
    <linearGradient id="cross-shading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#E2E8F0"/>
      <stop offset="30%" stopColor="#FFFFFF"/>
      <stop offset="85%" stopColor="#CBD5E1"/>
      <stop offset="100%" stopColor="#94A3B8"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="mark-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Black Squircle Background -->
  <rect width="100" height="100" rx="24" fill="url(#sq-bg)"/>

  <!-- Logo Mark Group -->
  <g filter="url(#mark-glow)">
    <!-- Horizontal Crossbar connecting the two uprights -->
    <rect x="36" y="44" width="28" height="12" rx="4" fill="url(#cross-shading)"/>

    <!-- Left Vertical Pillar (White Rounded Pill) -->
    <rect x="25" y="24" width="16" height="52" rx="8" fill="#FFFFFF"/>

    <!-- Right Vertical Pillar (White Rounded Pill, lower profile) -->
    <rect x="59" y="38" width="16" height="38" rx="8" fill="#FFFFFF"/>

    <!-- Vibrant Blue Node Sphere above right pillar -->
    <circle cx="67" cy="27" r="7.5" fill="url(#blue-sphere)"/>
  </g>
</svg>
